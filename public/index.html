<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Max's Auto Dealership</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark" aria-label="Main navigation">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold">Max's Auto Dealership</span>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white-50 small" id="nav-user" aria-live="polite"></span>
          <button class="btn btn-outline-light btn-sm" id="logout-btn">Sign Out</button>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="container-fluid py-4 flex-grow-1" id="main-content">
      <div class="row g-4 align-items-start">

        <!-- Form column -->
        <div class="col-lg-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h2 class="h5 card-title fw-bold" id="form-title">Add a Car</h2>
              <form id="car-form" novalidate>
                <input type="hidden" id="edit-id" value="">

                <div class="mb-2">
                  <label for="make" class="form-label">Make</label>
                  <input type="text" id="make" name="make" class="form-control form-control-sm"
                         placeholder="e.g. Toyota" required>
                </div>

                <div class="mb-2">
                  <label for="model" class="form-label">Model</label>
                  <input type="text" id="model" name="model" class="form-control form-control-sm"
                         placeholder="e.g. Camry" required>
                </div>

                <div class="mb-2">
                  <label for="year" class="form-label">Year</label>
                  <input type="number" id="year" name="year" class="form-control form-control-sm"
                         min="1900" max="2026" placeholder="e.g. 2020" required>
                </div>

                <div class="mb-2">
                  <label for="price" class="form-label">Price ($)</label>
                  <input type="number" id="price" name="price" class="form-control form-control-sm"
                         min="0" step="100" placeholder="e.g. 18000" required>
                </div>

                <div class="mb-2">
                  <label for="mpg" class="form-label">MPG</label>
                  <input type="number" id="mpg" name="mpg" class="form-control form-control-sm"
                         min="0" step="0.1" placeholder="e.g. 32" required>
                </div>

                <!-- Radio buttons: Transmission -->
                <fieldset class="mb-2">
                  <legend class="form-label mb-1">Transmission</legend>
                  <div class="d-flex gap-3">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="transmission"
                             id="trans-auto" value="Automatic" checked>
                      <label class="form-check-label" for="trans-auto">Automatic</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="transmission"
                             id="trans-manual" value="Manual">
                      <label class="form-check-label" for="trans-manual">Manual</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="transmission"
                             id="trans-cvt" value="CVT">
                      <label class="form-check-label" for="trans-cvt">CVT</label>
                    </div>
                  </div>
                </fieldset>

                <!-- Checkbox: Certified Pre-Owned -->
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="certified" name="certified" value="true">
                  <label class="form-check-label" for="certified">Certified Pre-Owned</label>
                </div>

                <!-- Textarea: Notes -->
                <div class="mb-3">
                  <label for="notes" class="form-label">Notes</label>
                  <textarea id="notes" name="notes" class="form-control form-control-sm"
                            rows="2" placeholder="Additional details…"></textarea>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" id="submit-btn" class="btn btn-primary btn-sm flex-fill">Add Car</button>
                  <button type="button" id="cancel-btn" class="btn btn-secondary btn-sm d-none">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Inventory column -->
        <div class="col-lg-9">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h2 class="h5 card-title fw-bold">My Inventory</h2>
              <div class="table-responsive">
                <table class="table table-hover table-sm align-middle" id="inventory-table">
                  <thead class="table-dark">
                    <tr>
                      <th scope="col">Make</th>
                      <th scope="col">Model</th>
                      <th scope="col">Year</th>
                      <th scope="col">Price</th>
                      <th scope="col">MPG</th>
                      <th scope="col">Trans.</th>
                      <th scope="col">CPO</th>
                      <th scope="col">Value</th>
                      <th scope="col">Notes</th>
                      <th scope="col">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="inventory-body"></tbody>
                </table>
              </div>
              <p id="empty-msg" class="text-muted text-center d-none py-3">
                No cars in your inventory yet — add one using the form!
              </p>
            </div>
          </div>
        </div>

      </div>
    </main>

    <footer class="bg-dark text-secondary text-center py-2 small" id="site-footer">
      &copy; 2025 Max's Auto Dealership
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
